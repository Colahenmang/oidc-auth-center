services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: oidc_auth_center
      MYSQL_USER: oidc_demo
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:-local-oidc-demo-db-password}
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:-local-oidc-mysql-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1
          --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --connect-timeout=3
          --batch --execute='SELECT 1'
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s

  auth-server:
    build:
      context: .
      args:
        MODULE: auth-server
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DEMO_DB_URL: "jdbc:mysql://mysql:3306/oidc_auth_center?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
      DEMO_DB_USER: oidc_demo
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:-local-oidc-demo-db-password}
      DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET:-local-demo-client-secret}
      DEMO_HR_CLIENT_SECRET: ${DEMO_HR_CLIENT_SECRET:-local-hr-demo-client-secret}
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:9000/.well-known/openid-configuration"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s

  demo-client:
    build:
      context: .
      args:
        MODULE: demo-client
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET:-local-demo-client-secret}
      DEMO_AUTH_BACKCHANNEL: http://auth-server:9000
      DEMO_REDIRECT_URI: ${DEMO_REDIRECT_URI:-http://127.0.0.1:8081/login/oauth2/code/work-order}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      auth-server:
        condition: service_healthy

  hr-client:
    build:
      context: .
      args:
        MODULE: demo-client
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: hr
      DEMO_HR_CLIENT_SECRET: ${DEMO_HR_CLIENT_SECRET:-local-hr-demo-client-secret}
      DEMO_AUTH_BACKCHANNEL: http://auth-server:9000
      DEMO_HR_REDIRECT_URI: ${DEMO_HR_REDIRECT_URI:-http://127.0.0.1:8082/login/oauth2/code/hr}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      auth-server:
        condition: service_healthy

volumes:
  mysql-data:
