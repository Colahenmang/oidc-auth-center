<body>
<header class="site-header">
    <div class="header-content">
        <span class="app-mark" aria-hidden="true"><span class="ticket-mark"></span></span>
        <span>工单登录演示</span>
    </div>
</header>
<main class="work-order">
    <div class="visual-panel" aria-hidden="true">
        <div class="visual-stage">
            <div class="visual-ticket">
                <div class="visual-ticket-heading">
                    <span class="ticket-mark"></span>
                    <span></span>
                </div>
                <div class="visual-ticket-lines"><span></span><span></span><span></span></div>
            </div>
            <div class="visual-identity"><span class="check-mark"></span></div>
        </div>
    </div>
    <section class="work-order-content" aria-labelledby="page-title">
        <th:block th:if="${employeeId == null}">
            <h1 id="page-title">登录工单系统</h1>
            <p class="intro">使用员工账号，通过统一认证中心登录。</p>
            <p class="error" role="alert" th:if="${param.error != null}">登录未完成，请重新发起登录。</p>
            <a class="button primary" th:href="@{/oauth2/authorization/work-order}">
                登录<span class="button-arrow" aria-hidden="true"></span>
            </a>
        </th:block>
        <th:block th:if="${employeeId != null}">
            <h1 class="success-heading" id="page-title">
                <span class="success-icon" aria-hidden="true"><span class="check-mark"></span></span>
                登录成功
            </h1>
            <dl class="employee">
                <div><dt>当前员工</dt><dd th:text="${employeeName}"></dd></div>
                <div><dt>员工 ID</dt><dd><code th:text="${employeeId}"></code></dd></div>
            </dl>
            <form th:action="@{/logout}" method="post">
                <button class="button secondary" type="submit">退出工单</button>
            </form>
        </th:block>
    </section>
</main>
</body>
</html>
