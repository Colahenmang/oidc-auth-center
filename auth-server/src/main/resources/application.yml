server:
  address: 127.0.0.1
  port: 9000
  servlet:
    session:
      cookie:
        name: AUTH_CENTER_SESSION
        http-only: true
        same-site: lax

spring:
  datasource:
    url: '${DEMO_DB_URL:jdbc:mysql://127.0.0.1:3306/oidc_auth_center?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}'
    username: '${DEMO_DB_USER:oidc_demo}'
    password: '${DEMO_DB_PASSWORD}'
  sql:
    init:
      mode: always

demo:
  issuer: http://127.0.0.1:9000
  employee-password: '${DEMO_EMPLOYEE_PASSWORD:Demo-Employee-2026!}'
  admin-password: '${DEMO_ADMIN_PASSWORD:Demo-Admin-2026!}'
  client-secret: '${DEMO_CLIENT_SECRET:local-demo-client-secret}'
  hr-client-secret: '${DEMO_HR_CLIENT_SECRET:local-hr-demo-client-secret}'
