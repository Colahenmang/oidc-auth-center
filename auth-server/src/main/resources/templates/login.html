<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('员工登录 · 认证中心')}">
    <title>员工登录 · 认证中心</title>
</head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<main class="page auth-page">
    <section class="auth-panel" aria-labelledby="login-title">
        <div class="auth-panel__aside" aria-hidden="true">
            <div th:replace="~{fragments/shell :: identityArt}"></div>
        </div>
        <div class="auth-panel__body">
            <h1 id="login-title">统一登录</h1>
            <p class="muted auth-panel__intro">使用员工或管理员账号登录。验证通过后，你会回到发起登录的应用。</p>
            <p class="notice notice--error" role="alert" th:if="${param.error}">账号或密码错误，请重试。</p>
            <p class="notice notice--success" role="status" th:if="${param.logout}">已退出认证中心。</p>
            <form class="form-stack" th:action="@{/login}" method="post">
                <div class="form-field">
                    <label for="username">账号</label>
                    <input id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="form-field">
                    <label for="password">密码</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="button button--primary button--full" type="submit">登录 <span class="chevron" aria-hidden="true"></span></button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
