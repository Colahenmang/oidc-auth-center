<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">员工认证中心</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" href="data:,">
</head>
<body>
<header class="topbar" th:fragment="topbar">
    <div class="topbar__inner">
        <a class="brand" th:href="@{/}">
            <span class="brand__mark" aria-hidden="true"></span>
            <span>员工认证中心</span>
        </a>
        <div class="session" th:if="${signedInUsername != null}">
            <span class="session__account">当前账号 <strong th:text="${signedInUsername}"></strong></span>
            <form th:action="@{/logout}" method="post">
                <button class="button button--quiet" type="submit">退出认证中心</button>
            </form>
        </div>
    </div>
</header>
<aside class="workspace__sidebar" th:fragment="adminSidebar(activePage)">
    <nav class="workspace-nav" aria-label="认证中心">
        <a th:href="@{/}"><span class="nav-icon nav-icon--home" aria-hidden="true"></span>返回首页</a>
        <a th:href="@{/admin/application}" th:classappend="${activePage == 'application' ? 'workspace-nav__active' : null}"
           th:attr="aria-current=${activePage == 'application' ? 'page' : null}">
            <span class="nav-icon nav-icon--application" aria-hidden="true"></span>应用配置
        </a>
        <a th:href="@{/admin/employees}" th:classappend="${activePage == 'employees' ? 'workspace-nav__active' : null}"
           th:attr="aria-current=${activePage == 'employees' ? 'page' : null}">
            <span class="nav-icon nav-icon--employee" aria-hidden="true"></span>员工管理
        </a>
    </nav>
    <form th:action="@{/logout}" method="post">
        <button class="button button--quiet" type="submit">退出认证中心</button>
    </form>
</aside>
<div class="identity-art" th:fragment="identityArt" aria-hidden="true">
    <div class="identity-art__canvas">
        <span class="identity-art__orbit identity-art__orbit--outer"></span>
        <span class="identity-art__orbit identity-art__orbit--inner"></span>
        <span class="identity-art__track"></span>
        <span class="identity-art__node identity-art__node--left"></span>
        <span class="identity-art__node identity-art__node--right"></span>
        <span class="identity-art__tile"><span class="brand__mark"></span></span>
    </div>
</div>
</body>
</html>
