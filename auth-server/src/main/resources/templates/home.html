<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('员工认证中心')}">
    <title>员工认证中心</title>
</head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<main class="page landing">
    <section class="hero" aria-labelledby="home-title">
        <div class="hero__copy">
            <h1 id="home-title">员工统一登录</h1>
            <p>一个员工账号可访问多个应用。登录后，切换到已开通的应用时可以免输密码。</p>
            <a class="button button--quiet" th:href="@{/admin/application}">管理应用 <span class="chevron" aria-hidden="true"></span></a>
        </div>
        <div th:replace="~{fragments/shell :: identityArt}"></div>
    </section>
    <section class="application-entry" id="applications" aria-labelledby="applications-title">
        <h2 id="applications-title">演示应用入口</h2>
        <p class="application-entry__hint">先登录工单系统，看到当前员工后，再用同一个浏览器打开人事系统并点登录，体验免输密码进入。</p>
        <nav class="destinations" aria-label="业务系统">
            <a class="destination" href="http://127.0.0.1:8081/">
                <span class="symbol symbol--grid" aria-hidden="true"></span>
                <span class="destination__body">
                    <strong>工单系统</strong>
                    <span>登录并查看当前员工</span>
                </span>
                <span class="chevron" aria-hidden="true"></span>
            </a>
            <a class="destination" href="http://127.0.0.1:8082/">
                <span class="symbol symbol--person" aria-hidden="true"></span>
                <span class="destination__body">
                    <strong>人事系统</strong>
                    <span>需开通人事访问权限</span>
                </span>
                <span class="chevron" aria-hidden="true"></span>
            </a>
            <a class="destination" href="http://127.0.0.1:8083/">
                <span class="symbol symbol--finance" aria-hidden="true"></span>
                <span class="destination__body">
                    <strong>财务系统</strong>
                    <span>登记应用并启动后可用</span>
                </span>
                <span class="chevron" aria-hidden="true"></span>
            </a>
        </nav>
    </section>
</main>
</body>
</html>
