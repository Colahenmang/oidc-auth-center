<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('应用配置 · 员工认证中心')}">
    <title>应用配置 · 员工认证中心</title>
</head>
<body>
<header th:replace="~{fragments/shell :: topbar}"></header>
<div class="page workspace">
    <aside class="workspace__sidebar">
        <nav class="workspace-nav" aria-label="认证中心">
            <a th:href="@{/}">返回首页</a>
            <a class="workspace-nav__active" th:href="@{/admin/application}" aria-current="page">应用配置</a>
        </nav>
        <form th:action="@{/logout}" method="post">
            <button class="button button--quiet" type="submit">退出认证中心</button>
        </form>
    </aside>
    <main class="workspace__main" aria-labelledby="application-title">
        <div class="workspace__heading">
            <h1 id="application-title">应用配置</h1>
            <p class="muted">管理应用接收登录结果的地址。</p>
        </div>
        <section class="card application" aria-labelledby="application-name">
            <header class="application__header">
                <span class="symbol symbol--grid" aria-hidden="true"></span>
                <div>
                    <h2 id="application-name" th:text="${clientName}">工单演示</h2>
                    <dl class="application__meta">
                        <dt>应用 ID</dt>
                        <dd><code th:text="${clientId}"></code></dd>
                    </dl>
                </div>
            </header>
            <div class="application__body">
                <p class="notice notice--success" role="status" th:if="${saved}">回调地址已保存。</p>
                <p class="notice notice--error" id="callback-error" role="alert" th:if="${error}" th:text="${error}"></p>
                <form class="form-stack" th:action="@{/admin/application}" method="post">
                    <div class="form-field">
                        <label for="redirect-uri">登录回调地址</label>
                        <input class="url-field" id="redirect-uri" name="redirectUri" th:value="${redirectUri}" type="url"
                               autocomplete="off" maxlength="1000" required
                               th:attr="aria-invalid=${error != null},aria-describedby=${error != null ? 'callback-help callback-error' : 'callback-help'}">
                        <p class="hint" id="callback-help">工单应用发来的协议、主机、端口和路径须与登记地址完全一致。</p>
                    </div>
                    <div class="form-actions">
                        <button class="button button--primary" type="submit">保存回调地址</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
