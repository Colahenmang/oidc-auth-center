<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('应用配置 · 员工认证中心')}">
    <title>应用配置 · 员工认证中心</title>
</head>
<body class="admin-console">
<header th:replace="~{fragments/shell :: topbar}"></header>
<div class="page workspace">
    <aside th:replace="~{fragments/shell :: adminSidebar('application')}"></aside>
    <main class="workspace__main" aria-labelledby="application-title">
        <div class="workspace__heading application-page__heading">
            <div>
                <h1 id="application-title">应用配置</h1>
                <p class="muted">分别设置各应用接收登录结果的地址。应用发来的地址须与登记地址完全一致。</p>
            </div>
            <a class="button button--primary workspace__add" href="#application-create">新增应用</a>
        </div>
        <p class="notice notice--success" role="status" th:if="${applicationDeleted}">应用已删除。</p>
        <p class="notice notice--error" role="alert" th:if="${deletionError != null}" th:text="${deletionError}"></p>
        <section class="card application-delete" th:if="${deletionCandidate != null}" aria-labelledby="application-delete-title">
            <h2 id="application-delete-title">删除应用</h2>
            <p id="application-delete-help">
                将删除「<strong th:text="${deletionCandidate.clientName}">演示应用</strong>」的接入配置。
                删除后，该应用将无法再通过认证中心发起新登录。
            </p>
            <dl class="application__meta">
                <dt>应用 ID</dt>
                <dd><code th:text="${deletionCandidate.clientId}"></code></dd>
            </dl>
            <form class="form-actions" th:action="@{/admin/application/delete}" method="post"
                  aria-labelledby="application-delete-title" aria-describedby="application-delete-help">
                <input type="hidden" name="clientId" th:value="${deletionCandidate.clientId}">
                <a class="button button--quiet" th:href="@{/admin/application}">取消</a>
                <button class="button button--danger" type="submit" name="confirmed" value="true">确认删除</button>
            </form>
        </section>
        <section class="card application-credentials" aria-labelledby="application-credentials-title"
                 th:if="${createdClientId != null and createdClientSecret != null}">
            <h2 id="application-credentials-title">应用已创建</h2>
            <p id="application-secret-help">请现在复制 Client Secret。离开或刷新页面后，它将不再显示。</p>
            <div class="application-credentials__fields">
                <div class="form-field">
                    <label for="created-client-id">Client ID</label>
                    <input class="url-field" id="created-client-id" type="text" th:value="${createdClientId}"
                           autocomplete="off" spellcheck="false" readonly>
                </div>
                <div class="form-field">
                    <label for="created-client-secret">Client Secret</label>
                    <input class="url-field" id="created-client-secret" type="text" th:value="${createdClientSecret}"
                           aria-describedby="application-secret-help" autocomplete="off" spellcheck="false" readonly>
                </div>
            </div>
        </section>
        <p class="notice notice--error application-registration-error" role="alert" th:if="${registrationError != null}">
            <span id="registration-error" th:text="${registrationError}"></span>
            <a href="#application-create">返回新增表单</a>
        </p>
        <p class="notice notice--error" role="alert" th:if="${error != null and errorClientId == null}" th:text="${error}"></p>
        <div class="workspace__sections">
            <section class="application-list" aria-labelledby="application-list-title">
                <header class="workspace__section-heading">
                    <p class="workspace__section-title" id="application-list-title">已登记应用</p>
                    <span class="workspace__count" th:text="|${#lists.size(applications)} 个应用|">2 个应用</span>
                </header>
                <section class="card application" th:each="app : ${applications}"
                         th:with="titleId=${'application-name-' + app.clientId},
                                  fieldId=${app.clientId == 'work-order-demo' ? 'redirect-uri' : 'redirect-uri-' + app.clientId},
                                  errorId=${'callback-error-' + app.clientId},
                                  hasError=${app.clientId == errorClientId and error != null}"
                         th:attr="aria-labelledby=${titleId}">
                    <header class="application__header">
                        <span class="symbol symbol--grid" th:classappend="${app.clientId == 'hr-demo' ? 'application__symbol--hr' : null}"
                              aria-hidden="true"></span>
                        <div>
                            <h2 th:id="${titleId}" th:text="${app.clientName}">工单演示</h2>
                            <dl class="application__meta">
                                <dt>应用 ID</dt>
                                <dd>
                                    <code th:if="${app.clientId.length() <= 20}" th:text="${app.clientId}"></code>
                                    <details class="application__client-id" th:if="${app.clientId.length() > 20}">
                                        <summary th:aria-label="|查看 ${app.clientName} 的完整应用 ID|">
                                            <code th:text="|${app.clientId.substring(0, 12)}…|"></code>
                                        </summary>
                                        <code th:text="${app.clientId}"></code>
                                    </details>
                                </dd>
                            </dl>
                        </div>
                    </header>
                    <div class="application__body">
                        <p class="notice notice--success" role="status" th:if="${app.clientId == savedClientId}">回调地址已保存。</p>
                        <p class="notice notice--error" th:id="${errorId}" role="alert" th:if="${hasError}" th:text="${error}"></p>
                        <form class="form-stack application__form" th:action="@{/admin/application}" method="post" th:attr="aria-labelledby=${titleId}">
                            <input type="hidden" name="clientId" th:value="${app.clientId}">
                            <div class="form-field">
                                <label th:for="${fieldId}">登录回调地址</label>
                                <input class="url-field" th:id="${fieldId}" name="redirectUri"
                                       th:value="${hasError ? submittedRedirectUri : app.redirectUri}" type="url"
                                       autocomplete="off" maxlength="1000" required
                                       th:attr="aria-invalid=${hasError},aria-describedby=${hasError ? errorId : null}">
                            </div>
                            <div class="form-actions application__actions">
                                <button class="button button--primary" type="submit">保存回调地址</button>
                            </div>
                        </form>
                        <section class="application__access" th:if="${app.clientId == 'hr-demo'}"
                                 aria-labelledby="hr-access-title">
                            <h3 id="hr-access-title">人事访问权限</h3>
                            <a class="button button--quiet" th:href="@{/admin/employees}">管理员工权限</a>
                        </section>
                        <div class="application__delete-actions" th:if="${app.deletable()}">
                            <a class="button button--delete" th:href="@{/admin/application/delete(clientId=${app.clientId})}"
                               th:attr="aria-label=|删除应用 ${app.clientName}|">删除应用</a>
                        </div>
                    </div>
                </section>
            </section>
            <section class="card application-create" id="application-create" aria-labelledby="application-create-title">
                <h2 id="application-create-title">新增应用</h2>
                <form class="form-stack application-create__form" id="application-create-form"
                      th:action="@{/admin/application/create}" method="post">
                    <div class="form-field">
                        <label for="new-client-name">应用名称</label>
                        <input id="new-client-name" type="text" name="clientName" th:value="${submittedClientName}"
                               autocomplete="off" maxlength="80" required
                               th:attr="aria-describedby=${registrationError != null ? 'registration-error' : null}">
                    </div>
                    <div class="form-field">
                        <label for="new-client-redirect-uri">登录回调地址</label>
                        <input class="url-field" id="new-client-redirect-uri" type="url" name="redirectUri"
                               th:value="${submittedNewRedirectUri}" autocomplete="off" spellcheck="false" maxlength="1000"
                               placeholder="https://portal.example.com/login/oauth2/code/portal" required
                               th:attr="aria-describedby=${registrationError != null ? 'registration-error' : null}">
                    </div>
                    <button class="button button--primary" type="submit">创建应用</button>
                </form>
            </section>
        </div>
    </main>
</div>
</body>
</html>
